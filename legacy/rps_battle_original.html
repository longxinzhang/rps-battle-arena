<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>石头剪刀布大乱斗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    width: 100%; height: 100%; overflow: hidden; 
    background: #f0ede8; 
    font-family: -apple-system, 'PingFang SC', sans-serif;
    touch-action: none;
    user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  
  #ui-overlay {
    position: absolute; top: 0; left: 0; right: 0;
    pointer-events: none; z-index: 10;
    padding: 16px 20px;
  }
  .scoreboard {
    display: flex; gap: 16px; 
    font-size: 22px; font-weight: 700;
    color: #333;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  .scoreboard span { display: flex; align-items: center; gap: 4px; }
  
  #winner-screen {
    position: absolute; inset: 0;
    display: none; 
    flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45);
    z-index: 20;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #winner-screen.show { display: flex; }
  #winner-emoji { font-size: 100px; animation: bounce 0.6s ease infinite alternate; }
  #winner-text { 
    font-size: 28px; font-weight: 800; color: #fff; 
    margin-top: 12px; letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #restart-btn {
    margin-top: 32px; padding: 14px 48px;
    font-size: 18px; font-weight: 700;
    border: none; border-radius: 40px;
    background: #fff; color: #333;
    cursor: pointer; pointer-events: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: transform 0.15s;
  }
  #restart-btn:active { transform: scale(0.95); }
  
  @keyframes bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-16px) scale(1.1); }
  }
  
  #start-screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #f0ede8;
    z-index: 30;
  }
  #start-screen.hidden { display: none; }
  .start-title { font-size: 36px; font-weight: 900; color: #222; margin-bottom: 8px; }
  .start-sub { font-size: 15px; color: #888; margin-bottom: 40px; }
  .start-emojis { font-size: 64px; margin-bottom: 32px; letter-spacing: 12px; }
  .start-rule { font-size: 14px; color: #666; margin: 4px 0; }
  #start-btn {
    margin-top: 36px; padding: 16px 56px;
    font-size: 20px; font-weight: 700;
    border: none; border-radius: 40px;
    background: #333; color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: transform 0.15s;
  }
  #start-btn:active { transform: scale(0.95); }
  
  .count-config {
    display: flex; gap: 20px; margin-top: 28px; margin-bottom: 8px;
  }
  .count-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .count-item label { font-size: 28px; }
  .count-item input {
    width: 60px; text-align: center;
    font-size: 18px; font-weight: 700;
    border: 2px solid #ccc; border-radius: 10px;
    padding: 6px; background: #fff; color: #333;
  }
</style>
</head>
<body>

<div id="start-screen">
  <div class="start-emojis">🪨 ✂️ 📄</div>
  <div class="start-title">大乱斗</div>
  <div class="start-sub">石头剪刀布 · 物理碰撞吞并战</div>
  <div class="start-rule">🪨 吃 ✂️ · ✂️ 吃 📄 · 📄 吃 🪨</div>
  <div class="start-rule" style="margin-top:8px;color:#999;">弱势方被吞并转化为优势方</div>
  <div class="count-config">
    <div class="count-item"><label>🪨</label><input type="number" id="cfg-rock" value="15" min="1" max="60"></div>
    <div class="count-item"><label>✂️</label><input type="number" id="cfg-scissors" value="15" min="1" max="60"></div>
    <div class="count-item"><label>📄</label><input type="number" id="cfg-paper" value="15" min="1" max="60"></div>
  </div>
  <button id="start-btn">开始乱斗</button>
</div>

<div id="ui-overlay">
  <div class="scoreboard">
    <span>🪨 <b id="s-rock">0</b></span>
    <span>✂️ <b id="s-scissors">0</b></span>
    <span>📄 <b id="s-paper">0</b></span>
  </div>
</div>

<canvas id="game"></canvas>

<div id="winner-screen">
  <div id="winner-emoji"></div>
  <div id="winner-text">胜利！</div>
  <button id="restart-btn">再来一局</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, dpr;
let entities = [];
let gameOver = false;
let animId;

const TYPES = { ROCK: 0, SCISSORS: 1, PAPER: 2 };
const EMOJIS = ['🪨', '✂️', '📄'];
const RADIUS = 18;
const SPEED = 2.2;
const CHASE_STRENGTH = 0.012;
const FLEE_STRENGTH = 0.009;
const FRICTION = 0.995;
const CONVERT_COOLDOWN = 300; // ms

// who beats whom: ROCK beats SCISSORS, SCISSORS beats PAPER, PAPER beats ROCK
function beats(a, b) {
  return (a === TYPES.ROCK && b === TYPES.SCISSORS) ||
         (a === TYPES.SCISSORS && b === TYPES.PAPER) ||
         (a === TYPES.PAPER && b === TYPES.ROCK);
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function spawnEntities(rockN, scissorsN, paperN) {
  entities = [];
  const counts = [rockN, scissorsN, paperN];
  for (let t = 0; t < 3; t++) {
    for (let i = 0; i < counts[t]; i++) {
      entities.push({
        type: t,
        x: RADIUS + Math.random() * (W - RADIUS * 2),
        y: RADIUS + 60 + Math.random() * (H - RADIUS * 2 - 80),
        vx: (Math.random() - 0.5) * SPEED * 2,
        vy: (Math.random() - 0.5) * SPEED * 2,
        lastConverted: 0,
        scale: 1,
      });
    }
  }
}

function findNearest(e, targetType) {
  let best = null, bestD = Infinity;
  for (const o of entities) {
    if (o === e || o.type !== targetType) continue;
    const d = (o.x - e.x) ** 2 + (o.y - e.y) ** 2;
    if (d < bestD) { bestD = d; best = o; }
  }
  return best;
}

function preyType(t) { return (t + 1) % 3; }
function predatorType(t) { return (t + 2) % 3; }

function update(now) {
  for (const e of entities) {
    // chase prey
    const prey = findNearest(e, preyType(e.type));
    if (prey) {
      const dx = prey.x - e.x, dy = prey.y - e.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      e.vx += (dx / d) * CHASE_STRENGTH;
      e.vy += (dy / d) * CHASE_STRENGTH;
    }
    // flee predator
    const pred = findNearest(e, predatorType(e.type));
    if (pred) {
      const dx = pred.x - e.x, dy = pred.y - e.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      e.vx -= (dx / d) * FLEE_STRENGTH;
      e.vy -= (dy / d) * FLEE_STRENGTH;
    }

    // speed cap
    const spd = Math.sqrt(e.vx * e.vx + e.vy * e.vy);
    if (spd > SPEED * 2.5) {
      e.vx = (e.vx / spd) * SPEED * 2.5;
      e.vy = (e.vy / spd) * SPEED * 2.5;
    }

    e.vx *= FRICTION;
    e.vy *= FRICTION;
    e.x += e.vx;
    e.y += e.vy;

    // bounce walls
    if (e.x < RADIUS) { e.x = RADIUS; e.vx = Math.abs(e.vx) * 0.8; }
    if (e.x > W - RADIUS) { e.x = W - RADIUS; e.vx = -Math.abs(e.vx) * 0.8; }
    if (e.y < RADIUS) { e.y = RADIUS; e.vy = Math.abs(e.vy) * 0.8; }
    if (e.y > H - RADIUS) { e.y = H - RADIUS; e.vy = -Math.abs(e.vy) * 0.8; }

    // scale anim
    if (e.scale > 1) e.scale += (1 - e.scale) * 0.1;
  }

  // collisions — entity-entity
  for (let i = 0; i < entities.length; i++) {
    for (let j = i + 1; j < entities.length; j++) {
      const a = entities[i], b = entities[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minD = RADIUS * 2;
      if (dist < minD && dist > 0) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = minD - dist;
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        if (a.type === b.type) {
          // same type: elastic-ish bounce
          const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
          const dot = dvx * nx + dvy * ny;
          if (dot > 0) {
            a.vx -= dot * nx * 0.8;
            a.vy -= dot * ny * 0.8;
            b.vx += dot * nx * 0.8;
            b.vy += dot * ny * 0.8;
          }
        } else {
          // conversion
          let winner, loser;
          if (beats(a.type, b.type)) { winner = a; loser = b; }
          else if (beats(b.type, a.type)) { winner = b; loser = a; }
          else continue;

          if (now - loser.lastConverted > CONVERT_COOLDOWN) {
            loser.type = winner.type;
            loser.lastConverted = now;
            loser.scale = 1.5;
            // bounce apart
            loser.vx = -nx * SPEED * 1.2;
            loser.vy = -ny * SPEED * 1.2;
            winner.vx = nx * SPEED * 0.6;
            winner.vy = ny * SPEED * 0.6;
          }
        }
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  
  // subtle grid
  ctx.strokeStyle = 'rgba(0,0,0,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const e of entities) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(e.scale, e.scale);
    
    // shadow
    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    
    ctx.font = `${RADIUS * 1.6}px serif`;
    ctx.fillText(EMOJIS[e.type], 0, 1);
    ctx.restore();
  }
}

function updateScoreboard() {
  const counts = [0, 0, 0];
  for (const e of entities) counts[e.type]++;
  document.getElementById('s-rock').textContent = counts[0];
  document.getElementById('s-scissors').textContent = counts[1];
  document.getElementById('s-paper').textContent = counts[2];
  return counts;
}

function checkWin(counts) {
  const alive = counts.filter(c => c > 0);
  if (alive.length === 1) {
    gameOver = true;
    const winType = counts.indexOf(counts.find(c => c > 0));
    document.getElementById('winner-emoji').textContent = EMOJIS[winType];
    document.getElementById('winner-screen').classList.add('show');
  }
}

function loop(ts) {
  if (gameOver) return;
  update(ts);
  draw();
  const counts = updateScoreboard();
  checkWin(counts);
  animId = requestAnimationFrame(loop);
}

function startGame() {
  const r = parseInt(document.getElementById('cfg-rock').value) || 15;
  const s = parseInt(document.getElementById('cfg-scissors').value) || 15;
  const p = parseInt(document.getElementById('cfg-paper').value) || 15;
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('winner-screen').classList.remove('show');
  gameOver = false;
  resize();
  spawnEntities(r, s, p);
  updateScoreboard();
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('winner-screen').classList.remove('show');
  startGame();
});

window.addEventListener('resize', () => {
  resize();
});

resize();
</script>
</body>
</html>
